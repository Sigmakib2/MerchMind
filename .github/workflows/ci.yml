name: checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.13.6
      - run: uv sync --locked --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - run: uv run python scripts/check_skills.py
      - run: uv run merchmind demo --workspace workspaces/ci-demo
      - run: uv run merchmind demo --mode journey --workspace workspaces/ci-journey

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.6
      - run: uv build
      - run: uv venv .tmp/package-venv
      - run: uv pip install --python .tmp/package-venv/bin/python dist/*.whl
      - run: .tmp/package-venv/bin/python -I -m merchmind demo --workspace workspaces/package-demo
      - run: .tmp/package-venv/bin/python -I -m merchmind demo --mode journey --workspace workspaces/package-journey
